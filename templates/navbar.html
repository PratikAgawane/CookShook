<!-- templates/navbar.html -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <img src="{{ url_for('static', filename='cookshookicon.jpg') }}" alt="Logo" width="50" height="30" class="d-inline-block align-text-top">
      CookShook
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="/">
            <i class="fas fa-home"></i> Home
          </a>
        </li>

        

        {% if current_user.is_authenticated %}
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard') }}">
                <i class="fas fa-user"></i> Dashboard
            </a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('view_meal_plan') }}">
            <i class="fas fa-calendar-alt"></i> Meal Planner
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('view_favorites') }}">
            <i class="fas fa-heart"></i> My Favorites
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('share_recipe') }}">
            <i class="fas fa-upload"></i> Share a Recipe
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('view_shared_recipes') }}">
            <i class="fas fa-users"></i> Community Recipes
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('logout') }}">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('login') }}">
            <i class="fas fa-sign-in-alt"></i> Login
          </a>
        </li>
        {% endif %}

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('about') }}">
            <i class="fas fa-info-circle"></i> About Us
          </a>
        </li>

      </ul>
    </div>
  </div>
</nav>
